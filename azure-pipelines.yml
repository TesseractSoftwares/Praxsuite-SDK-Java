# Praxsuite SDK for Java - validate, build, mirror to GitHub, and publish to Maven Central
#
# PR and development: validate only.
# master:             validate, build the jar, mirror the source to the public GitHub repo, cut a
#                     GitHub Release carrying the jar, sources jar and javadoc jar, and - when
#                     publishToCentral is true - upload a signed bundle to the Central Portal.

# There is deliberately no paths: exclude here. Excluding README.md looks like an easy saving, but
# the mirror-to-GitHub step in this pipeline IS how the public repo gets updated - so a
# documentation-only change would never reach a single reader. Running the suite for a typo fix is
# the cheaper mistake.
trigger:
  branches:
    include:
      - master
      - development

pr:
  branches:
    include:
      - master
      - development

pool:
  name: tesseract-buildpool

variables:
  isMaster: $[eq(variables['Build.SourceBranch'], 'refs/heads/master')]
  githubRepo: 'TesseractSoftwares/Praxsuite-SDK-Java'
  # Pinned, not "latest". A latest link turns an unrelated upstream release into a broken build, and
  # Adoptium publishes a checksum for every asset so it is verified rather than trusted.
  jdkVersion: '21.0.12.1_1'
  jdkRelease: 'jdk-21.0.12.1%2B1'

  # Off until the three MAVEN-* secrets exist in prax-cicd-kv. AzureKeyVault@2 fails the task when a
  # name in SecretsFilter is missing, so gating the whole stage keeps every other build green while
  # the account is still being set up.
  publishToCentral: 'false'

  # USER_MANAGED, not AUTOMATIC, and this one is worth arguing for rather than defaulting.
  #
  # A Maven Central release is permanently immutable - there is no unpublish, no yank, and no 72-hour
  # window like npm's. A bad artifact is public at that coordinate forever, and the only remedy is
  # publishing another version and hoping people move. So the bundle is validated and staged by CI,
  # and a person clicks Publish in the portal after looking at it. That is one click per release
  # against a permanent mistake, which is a trade worth making - the TypeScript SDK shipped an empty
  # tarball to npm through a fully green pipeline, and npm at least let us replace it.
  centralPublishingType: 'USER_MANAGED'

stages:

# ─────────────────────────────────────────────────────────────────────────────
- stage: Validate
  displayName: 'Test'
  jobs:
    - job: Validate
      steps:
        # A pinned JDK rather than JavaToolInstaller@0. That task wants the JDK in the agent's tool
        # cache, and the equivalent Python task failed exactly that way on this pool - an empty
        # cache with no usable fallback. Downloading a known JDK is deterministic and needs no
        # agent-image cooperation.
        - script: |
            set -e
            BASE="https://github.com/adoptium/temurin21-binaries/releases/download/$(jdkRelease)"
            TARBALL="OpenJDK21U-jdk_x64_linux_hotspot_$(jdkVersion).tar.gz"

            cd "$(Agent.TempDirectory)"
            curl -fsSL "$BASE/$TARBALL" -o jdk.tar.gz
            curl -fsSL "$BASE/$TARBALL.sha256.txt" -o jdk.sha256.txt

            # Adoptium's file is "<sha>  <name>"; the name will not match ours, so compare hashes.
            EXPECTED=$(cut -d' ' -f1 jdk.sha256.txt)
            ACTUAL=$(sha256sum jdk.tar.gz | cut -d' ' -f1)
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "##vso[task.logissue type=error]JDK checksum mismatch. Expected $EXPECTED, got $ACTUAL."
              exit 1
            fi
            echo "JDK checksum verified."

            mkdir -p jdk && tar -xzf jdk.tar.gz -C jdk --strip-components=1
            echo "##vso[task.setvariable variable=JAVA_HOME]$(Agent.TempDirectory)/jdk"
            "$(Agent.TempDirectory)/jdk/bin/java" -version
          displayName: 'Install JDK 21'

        # The Gradle wrapper is committed, so there is no Gradle to install - it bootstraps the
        # pinned distribution itself and verifies its own checksum from gradle-wrapper.properties.
        - script: |
            set -e
            chmod +x ./gradlew
            ./gradlew --version
          displayName: 'Bootstrap Gradle'

        - script: |
            set -e
            ./gradlew test --console=plain
          displayName: 'Run tests'

        - task: PublishTestResults@2
          displayName: 'Publish test results'
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: 'JUnit'
            testResultsFiles: '**/build/test-results/test/TEST-*.xml'
            failTaskOnFailedTests: true

        # An empty dependency list is a feature of this artifact, not an accident, so it is asserted
        # against the generated POM rather than the build script - the POM is what a consumer
        # actually resolves.
        - script: |
            set -e
            ./gradlew generatePomFileForMavenJavaPublication --console=plain -q
            POM=build/publications/mavenJava/pom-default.xml
            test -f "$POM" || { echo "##vso[task.logissue type=error]No POM generated."; exit 1; }
            if grep -q '<dependencies>' "$POM"; then
              echo "##vso[task.logissue type=error]The published POM declares dependencies:"
              sed -n '/<dependencies>/,/<\/dependencies>/p' "$POM"
              exit 1
            fi
            echo "POM declares no dependencies, as intended."
          displayName: 'Assert zero dependencies'

        # This repo is mirrored to a PUBLIC GitHub repo, so a key committed here reaches every
        # consumer.
        - script: |
            set -e
            if grep -rEn 'sk_live_[A-Za-z0-9]{16,}' \
                 --include='*.java' --include='*.kts' --include='*.md' --include='*.yml' \
                 --include='*.properties' --exclude-dir=.git --exclude-dir=build \
                 --exclude-dir=.gradle . ; then
              echo "##vso[task.logissue type=error]A Praxsuite secret key is present. Revoke it now - this repo is mirrored publicly."
              exit 1
            fi
            echo "No secret keys found."
          displayName: 'Scan for leaked secret keys'

# ─────────────────────────────────────────────────────────────────────────────
- stage: Publish
  displayName: 'Build and mirror to GitHub'
  dependsOn: Validate
  condition: and(succeeded(), eq(variables.isMaster, true))
  jobs:
    - job: Publish
      steps:
        # Full history: the mirror push needs real commits, not a shallow clone.
        - checkout: self
          fetchDepth: 0
          persistCredentials: true

        - script: |
            set -e
            BASE="https://github.com/adoptium/temurin21-binaries/releases/download/$(jdkRelease)"
            TARBALL="OpenJDK21U-jdk_x64_linux_hotspot_$(jdkVersion).tar.gz"

            cd "$(Agent.TempDirectory)"
            curl -fsSL "$BASE/$TARBALL" -o jdk.tar.gz
            curl -fsSL "$BASE/$TARBALL.sha256.txt" -o jdk.sha256.txt
            EXPECTED=$(cut -d' ' -f1 jdk.sha256.txt)
            ACTUAL=$(sha256sum jdk.tar.gz | cut -d' ' -f1)
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "##vso[task.logissue type=error]JDK checksum mismatch."
              exit 1
            fi
            mkdir -p jdk && tar -xzf jdk.tar.gz -C jdk --strip-components=1
            echo "##vso[task.setvariable variable=JAVA_HOME]$(Agent.TempDirectory)/jdk"
          displayName: 'Install JDK 21'

        - task: AzureKeyVault@2
          displayName: 'Read publish secrets'
          inputs:
            azureSubscription: 'sc-acr-push-core-prod'
            KeyVaultName: 'prax-cicd-kv'
            SecretsFilter: 'GITHUB-SDK-MIRROR-TOKEN'
            RunAsPreJob: false

        # build.gradle.kts is the single source of truth for the version, so a release tag can never
        # disagree with what a consumer resolves.
        - script: |
            set -e
            VERSION=$(grep -m1 '^version = ' build.gradle.kts | cut -d'"' -f2)
            if [ -z "$VERSION" ]; then
              echo "##vso[task.logissue type=error]No version line in build.gradle.kts."
              exit 1
            fi
            echo "Artifact version: $VERSION"
            echo "##vso[task.setvariable variable=pkgVersion]$VERSION"
          displayName: 'Read artifact version'

        - script: |
            set -e
            chmod +x ./gradlew
            ./gradlew clean build --console=plain
            OUT="$(Build.ArtifactStagingDirectory)/package"
            mkdir -p "$OUT"
            cp build/libs/*.jar "$OUT"/
            ls -la "$OUT"
          displayName: 'Build jars'

        # An artifact that exists is not an artifact that works. The TypeScript SDK published a 7 KB
        # tarball containing no code, and every gate in that pipeline passed because each one checked
        # for the artifact's presence rather than its contents.
        - script: |
            set -e
            OUT="$(Build.ArtifactStagingDirectory)/package"
            MAIN=$(ls "$OUT"/*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar' | head -1)
            if [ -z "$MAIN" ]; then
              echo "##vso[task.logissue type=error]No main jar produced. Contents:"
              ls -la "$OUT"
              exit 1
            fi

            CLASSES=$(unzip -l "$MAIN" | grep -c '\.class$' || true)
            echo "$(basename "$MAIN") carries $CLASSES classes."
            if [ "$CLASSES" -lt 15 ]; then
              echo "##vso[task.logissue type=error]The jar does not contain the SDK. Contents:"
              unzip -l "$MAIN"
              exit 1
            fi

            # The bundled codec is what makes the zero-dependency claim work; if it is missing the
            # artifact is unusable in a way no compile check would reveal.
            if ! unzip -l "$MAIN" | grep -q 'com/tesseractsoftwares/praxsuite/json/Json.class'; then
              echo "##vso[task.logissue type=error]The bundled JSON codec is missing from the jar."
              exit 1
            fi

            # Sources and javadoc are what make the artifact pleasant in an IDE, and Maven Central
            # will require both later.
            ls "$OUT"/*-sources.jar >/dev/null 2>&1 || {
              echo "##vso[task.logissue type=error]No sources jar."; exit 1; }
            ls "$OUT"/*-javadoc.jar >/dev/null 2>&1 || {
              echo "##vso[task.logissue type=error]No javadoc jar."; exit 1; }

            echo "##vso[task.setvariable variable=mainJar]$MAIN"
          displayName: 'Verify the jar carries the SDK'

        - task: PublishBuildArtifacts@1
          displayName: 'Publish jar artifacts'
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)/package'
            ArtifactName: 'java-jars'

        - script: |
            set -e
            git config user.email "ci@tesseractsoftwares.com"
            git config user.name  "Tesseract CI"

            git remote remove github 2>/dev/null || true
            git remote add github "https://x-access-token:$(GITHUB-SDK-MIRROR-TOKEN)@github.com/$(githubRepo).git"

            # Read the mirror's head BEFORE fetching. --force-with-lease cannot protect anything if a
            # fetch runs first: fetching sets the remote-tracking ref to whatever GitHub currently
            # has, so the lease always matches and the push always wins. That is not hypothetical -
            # it silently reset commits pushed straight to a sibling SDK's mirror.
            REMOTE_SHA=$(git ls-remote github refs/heads/master | cut -f1)
            if [ -n "$REMOTE_SHA" ]; then
              git fetch github master
              if ! git merge-base --is-ancestor "$REMOTE_SHA" HEAD; then
                echo "##vso[task.logissue type=error]github.com/$(githubRepo) is at $REMOTE_SHA, which is not an ancestor of this build. Someone pushed to the mirror directly. Reconcile it - do not overwrite."
                exit 1
              fi
            fi

            echo "Mirroring master to github.com/$(githubRepo)"
            if ! git push github HEAD:refs/heads/master; then
              echo "##vso[task.logissue type=error]Mirror push failed. Check the token has contents:write on the mirror."
              exit 1
            fi
            echo "Mirror complete."
          displayName: 'Mirror source to GitHub'

        # Every call captures the HTTP status and prints GitHub's response when it is not what we
        # expect. curl -f is deliberately absent: it exits 22 with no message and no body, which cost
        # three builds on a sibling SDK failing with an empty log.
        - script: |
            TAG="v$(pkgVersion)"
            API="https://api.github.com/repos/$(githubRepo)"
            AUTH="Authorization: Bearer $(GITHUB-SDK-MIRROR-TOKEN)"
            OUT="$(Build.ArtifactStagingDirectory)/package"

            CODE=$(curl -sS -o /tmp/existing.json -w '%{http_code}' -H "$AUTH" "$API/releases/tags/$TAG")
            if [ "$CODE" = "200" ]; then
              if grep -q '"state": *"uploaded"' /tmp/existing.json; then
                echo "Release $TAG already exists with an asset attached - nothing to publish."
                exit 0
              fi
              echo "##vso[task.logissue type=error]Release $TAG exists but has no asset attached. Delete it (or attach the asset by hand) and re-run."
              exit 1
            fi
            if [ "$CODE" != "404" ]; then
              echo "##vso[task.logissue type=error]HTTP $CODE checking whether $TAG exists. GitHub said:"
              cat /tmp/existing.json; echo
              exit 1
            fi

            # No double quotes and no newlines in the notes: escaped quotes here become real quotes
            # once the shell expands them, and the body stops being valid JSON.
            NOTES="Gradle: implementation com.tesseractsoftwares:praxsuite-sdk:$(pkgVersion) -- Java 17+, zero dependencies. See CHANGELOG.md for what changed."
            CODE=$(curl -sS -o /tmp/release.json -w '%{http_code}' -X POST \
              -H "$AUTH" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" \
              "$API/releases" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"Praxsuite SDK for Java $(pkgVersion)\",\"body\":\"$NOTES\",\"draft\":false,\"prerelease\":false}")
            if [ "$CODE" != "201" ]; then
              echo "##vso[task.logissue type=error]GitHub refused to create release $TAG (HTTP $CODE). It said:"
              cat /tmp/release.json; echo
              exit 1
            fi

            RELEASE_ID=$(grep -o '"id": *[0-9]*' /tmp/release.json | head -1 | tr -dc '0-9')
            if [ -z "$RELEASE_ID" ]; then
              echo "##vso[task.logissue type=error]Release $TAG created but its id could not be read from:"
              cat /tmp/release.json; echo
              exit 1
            fi
            echo "Created release $TAG (id $RELEASE_ID)"

            UPLOADED=0
            for F in "$OUT"/*.jar; do
              [ -f "$F" ] || continue
              # ${F##*/} rather than $(basename ...) - ADO reads $(...) as its own variable syntax
              # and would pass the text through literally, producing a release with no asset while
              # the build stayed green.
              CODE=$(curl -sS -o /tmp/asset.json -w '%{http_code}' -X POST \
                -H "$AUTH" -H "Content-Type: application/java-archive" \
                --data-binary @"$F" \
                "https://uploads.github.com/repos/$(githubRepo)/releases/$RELEASE_ID/assets?name=${F##*/}")
              if [ "$CODE" != "201" ]; then
                echo "##vso[task.logissue type=error]Uploading ${F##*/} returned HTTP $CODE. GitHub said:"
                cat /tmp/asset.json; echo
                exit 1
              fi
              echo "  uploaded ${F##*/}"
              UPLOADED=$((UPLOADED + 1))
            done

            if [ "$UPLOADED" -lt 3 ]; then
              echo "##vso[task.logissue type=error]Expected the main, sources and javadoc jars; uploaded $UPLOADED."
              ls -la "$OUT"
              exit 1
            fi

            ATTACHED=$(curl -sS -H "$AUTH" "$API/releases/tags/$TAG" | grep -c '"state": *"uploaded"')
            if [ "$ATTACHED" -lt 3 ]; then
              echo "##vso[task.logissue type=error]Release $TAG reports only $ATTACHED uploaded asset(s) after $UPLOADED successful uploads."
              exit 1
            fi

            echo "Published release $TAG with $ATTACHED asset(s)"
          displayName: 'Cut GitHub release'

# ─────────────────────────────────────────────────────────────────────────────
- stage: Central
  displayName: 'Publish to Maven Central'
  dependsOn: Publish
  condition: and(succeeded(), eq(variables.isMaster, true), eq(variables.publishToCentral, 'true'))
  jobs:
    - job: Central
      steps:
        - script: |
            set -e
            BASE="https://github.com/adoptium/temurin21-binaries/releases/download/$(jdkRelease)"
            TARBALL="OpenJDK21U-jdk_x64_linux_hotspot_$(jdkVersion).tar.gz"

            cd "$(Agent.TempDirectory)"
            curl -fsSL "$BASE/$TARBALL" -o jdk.tar.gz
            curl -fsSL "$BASE/$TARBALL.sha256.txt" -o jdk.sha256.txt
            EXPECTED=$(cut -d' ' -f1 jdk.sha256.txt)
            ACTUAL=$(sha256sum jdk.tar.gz | cut -d' ' -f1)
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "##vso[task.logissue type=error]JDK checksum mismatch."
              exit 1
            fi
            mkdir -p jdk && tar -xzf jdk.tar.gz -C jdk --strip-components=1
            echo "##vso[task.setvariable variable=JAVA_HOME]$(Agent.TempDirectory)/jdk"
          displayName: 'Install JDK 21'

        # The signing key is stored base64-encoded rather than as armoured text. An armoured PGP key
        # is multi-line, and a multi-line value round-tripped through a pipeline variable is exactly
        # the kind of thing that arrives subtly reflowed - at which point the key does not import and
        # the error says nothing useful. Base64 is one line by construction.
        - task: AzureKeyVault@2
          displayName: 'Read Central secrets'
          inputs:
            azureSubscription: 'sc-acr-push-core-prod'
            KeyVaultName: 'prax-cicd-kv'
            SecretsFilter: 'MAVEN-SIGNING-KEY-B64,MAVEN-SIGNING-PASSWORD,MAVEN-CENTRAL-TOKEN'
            RunAsPreJob: false

        - script: |
            set -e
            VERSION=$(grep -m1 '^version = ' build.gradle.kts | cut -d'"' -f2)
            test -n "$VERSION" || { echo "##vso[task.logissue type=error]No version line."; exit 1; }
            echo "##vso[task.setvariable variable=pkgVersion]$VERSION"
            echo "Publishing version $VERSION"
          displayName: 'Read artifact version'

        # Central refuses a coordinate that already exists, and it refuses it AFTER the upload as a
        # validation failure rather than up front. Asking the repository first turns a confusing
        # failed deployment into a clear message here.
        - script: |
            set -e
            URL="https://repo1.maven.org/maven2/com/tesseractsoftwares/praxsuite-sdk/$(pkgVersion)/praxsuite-sdk-$(pkgVersion).pom"
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$URL")
            if [ "$CODE" = "200" ]; then
              echo "##vso[task.logissue type=error]com.tesseractsoftwares:praxsuite-sdk:$(pkgVersion) is already on Maven Central. A published coordinate is immutable - bump the version in build.gradle.kts."
              exit 1
            fi
            echo "Version $(pkgVersion) is not on Central yet (HTTP $CODE)."
          displayName: 'Check the version is unpublished'

        - script: |
            set -e
            chmod +x ./gradlew

            KEY_FILE="$(Agent.TempDirectory)/signing-key.asc"
            printf '%s' "$MAVEN_SIGNING_KEY_B64" | base64 -d > "$KEY_FILE"
            # A truncated or wrongly-encoded secret produces a file that is not a key at all, and
            # Gradle's failure for that case is opaque. Check the armour header instead.
            if ! head -1 "$KEY_FILE" | grep -q 'BEGIN PGP PRIVATE KEY BLOCK'; then
              echo "##vso[task.logissue type=error]MAVEN-SIGNING-KEY-B64 did not decode to an armoured PGP private key. Re-store it as base64 of the full armoured export."
              exit 1
            fi

            PRAX_SIGNING_KEY="$(cat "$KEY_FILE")" \
            PRAX_SIGNING_PASSWORD="$MAVEN_SIGNING_PASSWORD" \
              ./gradlew clean centralBundle --console=plain

            rm -f "$KEY_FILE"
          displayName: 'Build the signed bundle'
          env:
            MAVEN_SIGNING_KEY_B64: $(MAVEN-SIGNING-KEY-B64)
            MAVEN_SIGNING_PASSWORD: $(MAVEN-SIGNING-PASSWORD)

        # Central rejects an unsigned bundle, but it rejects it after the upload, in a deployment we
        # then have to go and drop by hand. Counting the signatures here is free.
        #
        # Ten: five files per artifact (jar, sources, javadoc, pom, module) across two artifacts. A
        # bundle with zero .asc files means signing silently no-op'd, which is exactly what happens
        # when the key variable arrives empty - isRequired goes false and the build stays green.
        - script: |
            set -e
            BUNDLE="build/central-bundle/praxsuite-sdk-$(pkgVersion)-bundle.zip"
            test -f "$BUNDLE" || { echo "##vso[task.logissue type=error]No bundle at $BUNDLE."; ls -R build/central-bundle 2>/dev/null; exit 1; }

            SIGS=$(unzip -l "$BUNDLE" | grep -c 'asc$' || true)
            echo "Bundle carries $SIGS signature(s)."
            if [ "$SIGS" -lt 10 ]; then
              echo "##vso[task.logissue type=error]Expected 10 signatures, found $SIGS. Signing did not run over every artifact. Contents:"
              unzip -l "$BUNDLE"
              exit 1
            fi

            # Both coordinates have to ship in the one bundle: praxsuite-sdk-kotlin depends on
            # praxsuite-sdk, so releasing them apart would publish a Kotlin artifact whose dependency
            # does not resolve.
            for A in praxsuite-sdk praxsuite-sdk-kotlin; do
              if ! unzip -l "$BUNDLE" | grep -q "com/tesseractsoftwares/$A/$(pkgVersion)/$A-$(pkgVersion).jar"; then
                echo "##vso[task.logissue type=error]$A-$(pkgVersion).jar is missing from the bundle."
                unzip -l "$BUNDLE"
                exit 1
              fi
            done

            # Central rejects a bundle containing maven-metadata.xml - metadata is the repository's to
            # generate. Gradle writes it into a file:// repo, so the exclude in centralBundle is
            # load-bearing and worth asserting rather than trusting.
            if unzip -l "$BUNDLE" | grep -q 'maven-metadata'; then
              echo "##vso[task.logissue type=error]The bundle contains maven-metadata.xml, which Central rejects."
              exit 1
            fi

            echo "##vso[task.setvariable variable=bundlePath]$BUNDLE"
          displayName: 'Verify the bundle is signed and complete'

        - task: PublishBuildArtifacts@1
          displayName: 'Publish the bundle'
          inputs:
            PathtoPublish: 'build/central-bundle'
            ArtifactName: 'central-bundle'

        # Central's Publisher API wants base64("username:password") after the word Bearer, which
        # reads like a mistake but is what it documents.
        #
        # The ENCODING HAPPENS HERE, not in the vault. The portal's token screen offers the pair
        # three ways - username, password, and a pre-encoded blob - so "store the base64 one" is a
        # step that gets got wrong, and getting it wrong produces a 401 that looks like a revoked
        # token rather than a formatting mistake. So MAVEN-CENTRAL-TOKEN holds whichever form you
        # pasted and this works it out: a colon means plaintext user:pass and needs encoding, no
        # colon means it is already base64 (base64 has no ':' in its alphabet, so the test is exact).
        #
        # No curl -f anywhere: it exits 22 with no body and no message, which cost three builds on a
        # sibling SDK failing with an empty log.
        - script: |
            set -e
            BUNDLE="$(bundlePath)"
            NAME="com.tesseractsoftwares:praxsuite-sdk:$(pkgVersion)"

            case "$MAVEN_CENTRAL_TOKEN" in
              *:*) AUTH=$(printf '%s' "$MAVEN_CENTRAL_TOKEN" | base64 -w0)
                   echo "Token stored as user:pass - encoded for the API." ;;
              *)   AUTH="$MAVEN_CENTRAL_TOKEN"
                   echo "Token stored pre-encoded." ;;
            esac

            CODE=$(curl -sS -o /tmp/upload.txt -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $AUTH" \
              -F "bundle=@$BUNDLE" \
              "https://central.sonatype.com/api/v1/publisher/upload?name=$NAME&publishingType=$(centralPublishingType)")

            if [ "$CODE" != "201" ]; then
              echo "##vso[task.logissue type=error]Central refused the bundle (HTTP $CODE). It said:"
              cat /tmp/upload.txt; echo
              exit 1
            fi

            DEPLOYMENT=$(tr -d '\r\n "' < /tmp/upload.txt)
            if [ -z "$DEPLOYMENT" ]; then
              echo "##vso[task.logissue type=error]Upload returned 201 but no deployment id. Body was:"
              cat /tmp/upload.txt; echo
              exit 1
            fi
            echo "Deployment $DEPLOYMENT accepted. Waiting for validation."
            echo "##vso[task.setvariable variable=deploymentId]$DEPLOYMENT"
          displayName: 'Upload the bundle to Central'
          env:
            MAVEN_CENTRAL_TOKEN: $(MAVEN-CENTRAL-TOKEN)

        # A 201 means Central took the file, not that the file is good. Validation is asynchronous and
        # can fail minutes later on a missing POM field or a signature it cannot verify - so a build
        # that stops at the upload reports success for a deployment that never publishes.
        - script: |
            set -e
            API="https://central.sonatype.com/api/v1/publisher/status?id=$(deploymentId)"

            case "$MAVEN_CENTRAL_TOKEN" in
              *:*) AUTH=$(printf '%s' "$MAVEN_CENTRAL_TOKEN" | base64 -w0) ;;
              *)   AUTH="$MAVEN_CENTRAL_TOKEN" ;;
            esac

            for I in $(seq 1 40); do
              CODE=$(curl -sS -o /tmp/status.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $AUTH" "$API")
              if [ "$CODE" != "200" ]; then
                echo "##vso[task.logissue type=error]HTTP $CODE reading deployment status. Central said:"
                cat /tmp/status.json; echo
                exit 1
              fi

              STATE=$(grep -o '"deploymentState" *: *"[A-Z_]*"' /tmp/status.json | head -1 | cut -d'"' -f4)
              echo "  [$I/40] $STATE"

              case "$STATE" in
                FAILED)
                  echo "##vso[task.logissue type=error]Central failed validation. Full response:"
                  cat /tmp/status.json; echo
                  echo "Drop the deployment at https://central.sonatype.com/publishing/deployments before re-running."
                  exit 1
                  ;;
                VALIDATED)
                  echo ""
                  echo "Deployment $(deploymentId) is validated and STAGED, not released."
                  echo "Release it at https://central.sonatype.com/publishing/deployments"
                  echo "A Central release is permanent - check the artifacts, then click Publish."
                  exit 0
                  ;;
                PUBLISHING|PUBLISHED)
                  echo "Deployment $STATE. It reaches Maven Central within ~15 minutes and search within a few hours."
                  exit 0
                  ;;
              esac
              sleep 15
            done

            echo "##vso[task.logissue type=warning]Still $STATE after 10 minutes. Check https://central.sonatype.com/publishing/deployments - the deployment is live, this build just stopped watching it."
          displayName: 'Wait for Central validation'
          env:
            MAVEN_CENTRAL_TOKEN: $(MAVEN-CENTRAL-TOKEN)
